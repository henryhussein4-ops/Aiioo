<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4d6bfe">
<title>WOD Assistant · DeepSeek</title>
<style>
:root{--bg:#fff;--pn:#f6f7fb;--tx:#1b1f2a;--mu:#6b7280;--bd:#e3e6ee;--ac:#4d6bfe;--ub:#e8edff;--cd:#0f1320;--ok:#16a34a;--er:#dc2626}
:root[data-t=dark]{--bg:#111318;--pn:#181b22;--tx:#e8eaf0;--mu:#98a0b3;--bd:#2a2e39;--ub:#25305e;--cd:#0a0c11}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:0}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;height:100dvh}
#sb{width:290px;background:var(--pn);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#ov{display:none}
@media(max-width:800px){#sb{position:fixed;z-index:30;top:0;bottom:0;left:0;transform:translateX(-100%);transition:.25s;width:84%;max-width:320px}
body.so #sb{transform:none}body.so #ov{display:block;position:fixed;inset:0;background:#0008;z-index:20}}
@media(min-width:801px){body.sc #sb{display:none}}
.sh{padding:12px;display:flex;flex-direction:column;gap:8px}
.nb{background:var(--ac);color:#fff;border-radius:12px;padding:12px;justify-content:center;font-weight:600}
.sr{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:0 10px}
.sr input{border:0;background:none;outline:0;flex:1;padding:9px 0;min-width:0}
#cl{flex:1;overflow:auto;padding:0 8px}
.ci{display:flex;align-items:center;gap:4px;padding:10px;border-radius:10px;cursor:pointer}
.ci.a{background:var(--bd)}.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.ci button{color:var(--mu);padding:4px}.ci .i{width:17px;height:17px}
.sf{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}
.sf button{width:100%;padding:10px;border-radius:10px;color:var(--tx)}.sf button:active,.ci:active{background:var(--bd)}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--bd)}
header h1{flex:1;font-size:16px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{padding:8px;border-radius:10px;color:var(--tx)}.ib:active{background:var(--bd)}
.chip{font-size:12px;background:var(--pn);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;color:var(--mu)}
#ms{flex:1;overflow-y:auto;padding:16px 12px 8px;scroll-behavior:smooth}
.w{max-width:760px;margin:0 auto}
.m{margin:0 0 18px;display:flex;gap:10px}
.m.u{justify-content:flex-end}
.ub{background:var(--ub);padding:10px 14px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;word-break:break-word;max-width:88%}
.av{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;flex:none}
.av .i{width:16px;height:16px}
.bd{flex:1;min-width:0}
.ac{display:flex;gap:2px;margin-top:4px;color:var(--mu);align-items:center;flex-wrap:wrap}
.m.u .ac{justify-content:flex-end}
.ac button{padding:6px;border-radius:8px}.ac button:active,.ac .on{background:var(--bd);color:var(--ac)}
.ac small{margin-left:6px;font-size:11px}
.dn{transform:rotate(180deg)}
.uw{display:flex;flex-direction:column;align-items:flex-end;max-width:92%}
.eb{width:100%;min-width:240px}
.eb textarea{width:100%;min-height:90px;background:var(--pn);border:1px solid var(--ac);border-radius:12px;padding:10px;outline:0;resize:vertical}
.eb div{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.eb button{padding:8px 14px;border-radius:10px;border:1px solid var(--bd)}.eb .go{background:var(--ac);color:#fff;border-color:var(--ac)}
details{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:8px;color:var(--mu);font-size:14px}
summary{cursor:pointer;display:flex;align-items:center;gap:6px;list-style:none}summary::-webkit-details-marker{display:none}
details>div{margin-top:6px;white-space:pre-wrap;word-break:break-word}
.md{word-break:break-word}.md>*:first-child{margin-top:0}
.md p{margin:.6em 0}.md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:1.1em 0 .4em}
.md h1{font-size:1.4em}.md h2{font-size:1.25em}.md h3{font-size:1.1em}
.md ul,.md ol{padding-left:1.4em;margin:.5em 0}.md li{margin:.2em 0}
.md a{color:var(--ac)}.md hr{border:0;border-top:1px solid var(--bd);margin:1em 0}
.md blockquote{margin:.6em 0;padding:2px 12px;border-left:3px solid var(--ac);color:var(--mu)}
.md code{background:var(--pn);border:1px solid var(--bd);padding:1px 5px;border-radius:6px;font:13.5px ui-monospace,Menlo,Consolas,monospace}
.code{margin:.7em 0;border-radius:12px;overflow:hidden;background:var(--cd);color:#e6e9f2}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#ffffff14;font-size:12px;color:#aab}
.ch button{color:#aab;font-size:12px}.ch .i{width:14px;height:14px}
.code pre{margin:0;padding:12px;overflow-x:auto}
.code code{background:none;border:0;padding:0;color:inherit;font-size:13px;white-space:pre}
.tw{overflow-x:auto;margin:.7em 0}
table{border-collapse:collapse;font-size:14px}th,td{border:1px solid var(--bd);padding:6px 10px;text-align:left}th{background:var(--pn)}
.dots{display:inline-flex;gap:4px;padding:8px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
.err{background:#dc262614;border:1px solid var(--er);color:var(--er);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.wl{text-align:center;padding:9vh 10px 0}.wl .av{width:56px;height:56px;margin:0 auto 12px}.wl .av .i{width:28px;height:28px}
.wl h2{margin:0 0 4px;font-size:24px}.wl p{color:var(--mu);margin:0 0 20px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sg button{border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:left;font-size:14px;background:var(--pn);display:block}
.sg b{display:block;margin-bottom:2px}.sg span{color:var(--mu);font-size:13px}
#sd{position:absolute;right:16px;bottom:120px;background:var(--bg);border:1px solid var(--bd);border-radius:50%;width:38px;height:38px;justify-content:center;box-shadow:0 2px 8px #0003;display:none}
#cp{padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.bx{max-width:760px;margin:0 auto;background:var(--pn);border:1px solid var(--bd);border-radius:22px;padding:8px 8px 8px 14px}
.bx:focus-within{border-color:var(--ac)}
#in{width:100%;border:0;background:none;outline:0;resize:none;max-height:160px;padding:6px 0;line-height:1.45}
.br{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.tg{border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-size:13px;color:var(--mu)}.tg.on{background:var(--ub);color:var(--ac);border-color:var(--ac)}
#sn{width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;justify-content:center}#sn:disabled{opacity:.4}
.ft{text-align:center;font-size:11px;color:var(--mu);margin-top:6px}
#md{display:none;position:fixed;inset:0;z-index:50;background:#0008;align-items:flex-end;justify-content:center}
#md.o{display:flex}
.sh2{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sh2 h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.f{margin:0 0 14px}.f label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:10px;outline:0}
.f input[type=range]{padding:0}.f textarea{min-height:80px}
.f small{display:block;color:var(--mu);font-size:12px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.bt{border:1px solid var(--bd);border-radius:10px;padding:9px 14px;background:var(--pn)}.bt.p{background:var(--ac);color:#fff;border-color:var(--ac)}.bt.d{color:var(--er)}
#ts{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#ts.o{opacity:1}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
<symbol id="i-find" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
<symbol id="i-ok" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M7 10v11H3V10zM7 10l4-8c1.5 0 2.5 1 2.5 2.5V8H19a2 2 0 0 1 2 2.3l-1.3 8A2 2 0 0 1 17.7 20H7"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
</defs></svg>

<div id="app">
<div id="ov"></div>
<aside id="sb">
 <div class="sh">
  <button class="nb" data-a="new"><svg class="i"><use href="#i-plus"/></svg>New chat</button>
  <div class="sr"><svg class="i"><use href="#i-find"/></svg><input id="q" placeholder="Search chats" autocomplete="off"></div>
 </div>
 <div id="cl"></div>
 <div class="sf"><button data-a="set"><svg class="i"><use href="#i-set"/></svg>Settings</button></div>
</aside>
<main>
 <header>
  <button class="ib" data-a="side" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
  <h1 id="ttl">New chat</h1>
  <button class="chip" data-a="set" id="mc"></button>
  <button class="ib" data-a="new" aria-label="New chat"><svg class="i"><use href="#i-edit"/></svg></button>
 </header>
 <div id="ms"><div class="w" id="w"></div></div>
 <button id="sd" data-a="down" aria-label="Scroll down"><svg class="i"><use href="#i-chev"/></svg></button>
 <div id="cp">
  <div class="bx">
   <textarea id="in" rows="1" placeholder="Message DeepSeek..."></textarea>
   <div class="br">
    <button class="tg" id="tk" data-a="think"><svg class="i" style="width:16px;height:16px"><use href="#i-bulb"/></svg>Think</button>
    <button id="sn" data-a="send" aria-label="Send"><svg class="i"><use href="#i-send"/></svg></button>
   </div>
  </div>
  <div class="ft">AI can make mistakes. Check important info. · World Of Discoveries</div>
 </div>
</main>
</div>

<div id="md"><div class="sh2" id="sm"></div></div>
<div id="ts"></div>

<script>
const $=s=>document.querySelector(s);
const ic=(n,c='')=>`<svg class="i ${c}"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const DEF={key:'',model:'deepseek-v4-flash',models:['deepseek-v4-flash','deepseek-v4-pro'],think:false,effort:'high',temp:1,sys:'You are a helpful, accurate and friendly AI assistant. Format answers in clean Markdown: short paragraphs, lists, tables and fenced code blocks where useful.',mode:'auto',proxy:'',theme:'auto'};
let cfg={...DEF,...ld('wod_cfg',{})},chats=ld('wod_chats',[]),cur=localStorage.getItem('wod_cur'),busy=false,ctrl=null,edit=-1,sq='';
const sv=()=>{try{localStorage.setItem('wod_chats',JSON.stringify(chats));localStorage.setItem('wod_cfg',JSON.stringify(cfg));localStorage.setItem('wod_cur',cur||'')}catch(e){}};
const chat=()=>chats.find(c=>c.id===cur);
function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('o');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('o'),2400)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Copied')}
function theme(){const t=cfg.theme==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):cfg.theme;document.documentElement.dataset.t=t}

/* Markdown */
const inl=t=>t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/~~(.+?)~~/g,'<s>$1</s>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function md(src){
 const cb=[];
 src=src.replace(/```([\w+#-]*)[^\S\n]*\n?([\s\S]*?)(```|$)/g,(_,l,c)=>{cb.push(`<div class="code"><div class="ch"><span>${esc(l||'text')}</span><button data-a="cc">${ic('copy')}Copy</button></div><pre><code>${esc(c.replace(/\n$/,''))}</code></pre></div>`);return '\n\u0000'+(cb.length-1)+'\u0000\n'});
 const L=src.split('\n'),o=[],LI=/^\s*(\d+[.)]|[-*+])\s+/;let i=0,p=[],m;
 const fp=()=>{if(p.length){o.push('<p>'+inl(esc(p.join('\n'))).replace(/\n/g,'<br>')+'</p>');p=[]}};
 while(i<L.length){const l=L[i];
  if(!l.trim()){fp();i++;continue}
  if(m=l.match(/^\u0000(\d+)\u0000$/)){fp();o.push(cb[m[1]]);i++;continue}
  if(m=l.match(/^(#{1,6})\s+(.*)/)){fp();const n=m[1].length;o.push(`<h${n}>${inl(esc(m[2]))}</h${n}>`);i++;continue}
  if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){fp();o.push('<hr>');i++;continue}
  if(/^>/.test(l)){fp();const q=[];while(i<L.length&&/^>/.test(L[i]))q.push(inl(esc(L[i++].replace(/^>\s?/,''))));o.push('<blockquote>'+q.join('<br>')+'</blockquote>');continue}
  if(LI.test(l)){fp();const ord=/^\s*\d/.test(l),it=[];while(i<L.length&&LI.test(L[i]))it.push(inl(esc(L[i++].replace(LI,''))));const t=ord?'ol':'ul';o.push(`<${t}>`+it.map(x=>'<li>'+x+'</li>').join('')+`</${t}>`);continue}
  if(l.includes('|')&&L[i+1]&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i+1])){fp();const row=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(x=>inl(esc(x.trim())));const h=row(l);i+=2;const b=[];while(i<L.length&&L[i].trim()&&L[i].includes('|'))b.push(row(L[i++]));o.push('<div class="tw"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+b.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue}
  p.push(l);i++}
 fp();return o.join('')}

/* Rendering */
function bub(m,i,last){
 if(m.role==='user'){
  if(edit===i)return `<div class="m u"><div class="uw eb"><textarea id="ed">${esc(m.content)}</textarea><div><button data-a="ecan">Cancel</button><button class="go" data-a="esave" data-i="${i}">Save & send</button></div></div></div>`;
  return `<div class="m u" data-i="${i}"><div class="uw"><div class="ub">${esc(m.content)}</div><div class="ac"><button data-a="cm" aria-label="Copy">${ic('copy')}</button><button data-a="ed" aria-label="Edit">${ic('edit')}</button></div></div></div>`}
 const live=busy&&last,wait=live&&!m.content&&!m.reasoning;
 let h=`<div class="m" data-i="${i}"><div class="av">${ic('spark')}</div><div class="bd">`;
 if(m.reasoning)h+=`<details${live&&!m.content?' open':''}><summary>${ic('bulb')}${live&&!m.content?'Thinking...':'Thought process'}</summary><div>${esc(m.reasoning)}</div></details>`;
 if(wait)h+='<span class="dots"><i></i><i></i><i></i></span>';
 if(m.content)h+=`<div class="md">${md(m.content)}</div>`;
 if(m.err)h+=`<div class="err">${esc(m.err)}</div>`;
 if(!live)h+=`<div class="ac"><button data-a="cm" aria-label="Copy">${ic('copy')}</button><button data-a="sh" aria-label="Share">${ic('share')}</button>${last?`<button data-a="rg" aria-label="Regenerate">${ic('redo')}</button>`:''}<button data-a="fb" data-v="1" class="${m.fb===1?'on':''}" aria-label="Good">${ic('up')}</button><button data-a="fb" data-v="-1" class="${m.fb===-1?'on':''}" aria-label="Bad">${ic('up','dn')}</button>${m.usage?`<small>${m.usage.total_tokens} tokens</small>`:''}</div>`;
 return h+'</div></div>'}
const SUG=[['Explain','Explain how neural networks learn, simply'],['Write','Write a professional email asking for a meeting'],['Code','Write a JavaScript function to debounce input, with example'],['Plan','Create a 7-day study plan to learn English speaking']];
function paintMsgs(){
 const c=chat(),w=$('#w');
 if(!c||!c.msgs.length){w.innerHTML=`<div class="wl"><div class="av">${ic('spark')}</div><h2>How can I help you today?</h2><p>Powered by DeepSeek · ${esc(cfg.model)}</p><div class="sg">${SUG.map(s=>`<button data-a="sg" data-t="${esc(s[1])}"><b>${s[0]}</b><span>${esc(s[1])}</span></button>`).join('')}</div></div>`;return}
 w.innerHTML=c.msgs.map((m,i)=>bub(m,i,i===c.msgs.length-1)).join('')}
function paintList(){
 const l=chats.filter(c=>c.title.toLowerCase().includes(sq)).sort((a,b)=>b.ts-a.ts);
 $('#cl').innerHTML=l.length?l.map(c=>`<div class="ci${c.id===cur?' a':''}" data-id="${c.id}" data-a="open"><span>${esc(c.title)}</span><button data-a="ren" aria-label="Rename">${ic('edit')}</button><button data-a="del" aria-label="Delete">${ic('trash')}</button></div>`).join(''):'<p style="color:var(--mu);text-align:center;font-size:14px">No chats yet</p>'}
function ui(){const c=chat();$('#ttl').textContent=c?c.title:'New chat';$('#mc').textContent=cfg.model.replace('deepseek-','');$('#tk').classList.toggle('on',cfg.think);
 $('#sn').innerHTML=ic(busy?'stop':'send');paintMsgs();paintList();bot()}
function bot(f){const s=$('#ms');if(f||s.scrollHeight-s.scrollTop-s.clientHeight<140)s.scrollTop=s.scrollHeight}
let raf=0;
function paint(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const c=chat();if(!c)return;const i=c.msgs.length-1,e=$('#w').lastElementChild;if(e){e.outerHTML=bub(c.msgs[i],i,true)}bot()})}

/* Chats */
function newChat(){let c=chat();if(c&&!c.msgs.length){edit=-1;ui();return}
 c={id:'c'+Date.now(),title:'New chat',ts:Date.now(),msgs:[]};chats.push(c);cur=c.id;edit=-1;sv();ui()}
function closeSide(){document.body.classList.remove('so')}

/* API + CORS handling */
const BASE='https://api.deepseek.com';
async function api(path,opt){
 const px=cfg.proxy.trim().replace(/\/+$/,''),u=[];
 if(cfg.mode==='proxy'&&px)u.push(px+path);
 else if(cfg.mode==='public')u.push('https://corsproxy.io/?url='+encodeURIComponent(BASE+path));
 else{u.push(BASE+path);if(cfg.mode==='auto'&&px)u.push(px+path)}
 for(const x of u){try{return await fetch(x,opt)}catch(e){if(e.name==='AbortError')throw e}}
 const e=new Error('Could not reach DeepSeek. Check your internet. If your browser blocks the request (CORS), open Settings > Connection and add a free Cloudflare Worker proxy (code is provided there).');e.net=1;throw e}
const H=()=>({'Content-Type':'application/json',Authorization:'Bearer '+cfg.key.trim()});

async function gen(){
 const c=chat();if(!c||busy)return;
 if(!cfg.key.trim()){toast('Add your DeepSeek API key first');openSet();return}
 const a={role:'assistant',content:'',reasoning:''};c.msgs.push(a);busy=true;ctrl=new AbortController();ui();bot(1);
 const body={model:cfg.model,stream:true,stream_options:{include_usage:true},thinking:{type:cfg.think?'enabled':'disabled'},
  messages:[...(cfg.sys?[{role:'system',content:cfg.sys}]:[]),...c.msgs.slice(0,-1).map(m=>({role:m.role,content:m.content}))]};
 if(cfg.think)body.reasoning_effort=cfg.effort;else body.temperature=+cfg.temp;
 try{
  const r=await api('/chat/completions',{method:'POST',headers:H(),body:JSON.stringify(body),signal:ctrl.signal});
  if(!r.ok){const t=await r.text();let j=t;try{j=JSON.parse(t).error.message}catch(e){}throw new Error(({401:'Invalid API key. ',402:'Insufficient balance. ',429:'Rate limited, try again shortly. ',503:'Server busy, try again. '}[r.status]||'')+'('+r.status+') '+j)}
  const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
   for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(!d||d==='[DONE]')continue;
    try{const j=JSON.parse(d),dl=j.choices&&j.choices[0]&&j.choices[0].delta;if(dl){if(dl.reasoning_content)a.reasoning+=dl.reasoning_content;if(dl.content)a.content+=dl.content}if(j.usage)a.usage=j.usage}catch(e){}}
   paint()}
 }catch(e){if(e.name!=='AbortError')a.err=e.message}
 busy=false;ctrl=null;
 if(!a.content&&!a.reasoning&&!a.err)c.msgs.pop();
 c.ts=Date.now();sv();ui()}

function send(t){
 if(busy){ctrl&&ctrl.abort();return}
 t=(t||$('#in').value).trim();if(!t)return;
 if(!chat())newChat();const c=chat();
 c.msgs.push({role:'user',content:t});if(c.msgs.length===1)c.title=t.slice(0,40);
 $('#in').value='';fit();edit=-1;sv();gen()}
function fit(){const e=$('#in');e.style.height='auto';e.style.height=Math.min(e.scrollHeight,160)+'px'}

/* Settings */
const WK=`export default{async fetch(r){const u=new URL(r.url),C={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'*','Access-Control-Allow-Methods':'GET,POST,OPTIONS'};if(r.method==='OPTIONS')return new Response(null,{headers:C});const x=await fetch('https://api.deepseek.com'+u.pathname+u.search,{method:r.method,headers:{'Content-Type':'application/json','Authorization':r.headers.get('Authorization')||''},body:r.method==='GET'?null:r.body});return new Response(x.body,{status:x.status,headers:{...C,'Content-Type':x.headers.get('Content-Type')||'application/json'}})}}`;
function openSet(){
 const o=(v,a)=>a.map(x=>`<option value="${x}"${x===v?' selected':''}>${x}</option>`).join('');
 $('#sm').innerHTML=`<h3>Settings<button class="ib" data-a="cs" aria-label="Close">${ic('x')}</button></h3>
 <div class="f"><label>DeepSeek API key</label><input id="s-key" type="password" value="${esc(cfg.key)}" placeholder="sk-..." autocomplete="off"><small>Stored only on this device. Get a key at platform.deepseek.com</small></div>
 <div class="row f"><button class="bt p" data-a="test">Test key & load models</button><button class="bt" data-a="bal">Check balance</button></div>
 <div class="f"><label>Model</label><select id="s-model">${o(cfg.model,cfg.models)}</select></div>
 <div class="f"><label>Thinking mode (reasoning)</label><select id="s-think">${o(cfg.think?'On':'Off',['Off','On'])}</select></div>
 <div class="f"><label>Reasoning effort</label><select id="s-eff">${o(cfg.effort,['low','high','max'])}</select></div>
 <div class="f"><label>Creativity (temperature): <span id="tv">${cfg.temp}</span></label><input id="s-temp" type="range" min="0" max="2" step="0.1" value="${cfg.temp}"><small>Used when thinking is Off.</small></div>
 <div class="f"><label>System prompt</label><textarea id="s-sys">${esc(cfg.sys)}</textarea></div>
 <div class="f"><label>Connection (CORS)</label><select id="s-mode"><option value="auto"${cfg.mode==='auto'?' selected':''}>Auto: direct, then my proxy</option><option value="direct"${cfg.mode==='direct'?' selected':''}>Direct only</option><option value="proxy"${cfg.mode==='proxy'?' selected':''}>My proxy only</option><option value="public"${cfg.mode==='public'?' selected':''}>Public proxy (key passes through a 3rd party)</option></select></div>
 <div class="f"><label>My proxy URL (Cloudflare Worker)</label><input id="s-px" value="${esc(cfg.proxy)}" placeholder="https://name.you.workers.dev"><small>Free: create a Worker at dash.cloudflare.com, paste the code below, deploy, then paste its URL here.</small></div>
 <div class="row f"><button class="bt" data-a="wk">Copy Worker code</button></div>
 <div class="f"><label>Theme</label><select id="s-th">${o(cfg.theme,['auto','light','dark'])}</select></div>
 <div class="row"><button class="bt" data-a="exp">${ic('dl')}Export chat</button><button class="bt d" data-a="clr">Delete all chats</button></div>`;
 $('#md').classList.add('o')}
function rd(){const g=i=>$('#'+i);cfg.key=g('s-key').value.trim();cfg.model=g('s-model').value;cfg.think=g('s-think').value==='On';cfg.effort=g('s-eff').value;cfg.temp=g('s-temp').value;cfg.sys=g('s-sys').value;cfg.mode=g('s-mode').value;cfg.proxy=g('s-px').value.trim();cfg.theme=g('s-th').value;theme();sv();ui()}
async function test(){rd();try{const r=await api('/models',{headers:H()});const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);cfg.models=j.data.map(m=>m.id);if(!cfg.models.includes(cfg.model))cfg.model=cfg.models[0];sv();openSet();toast('Key works · '+cfg.models.length+' models loaded')}catch(e){toast(e.message.slice(0,120))}}
async function bal(){rd();try{const r=await api('/user/balance',{headers:H()});const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);toast('Balance: '+j.balance_infos.map(b=>b.total_balance+' '+b.currency).join(', '))}catch(e){toast(e.message.slice(0,120))}}
function exp(){const c=chat();if(!c||!c.msgs.length)return toast('Nothing to export');const t='# '+c.title+'\n\n'+c.msgs.map(m=>(m.role==='user'?'**You:** ':'**AI:** ')+m.content).join('\n\n---\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/markdown'}));a.download=c.title.replace(/[^\w]+/g,'_')+'.md';a.click()}

/* Events */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,c=chat(),row=b.closest('[data-i]'),i=row?+row.dataset.i:-1,m=c&&c.msgs[i];
 if(a==='new'){newChat();closeSide()}
 else if(a==='side'){document.body.classList.toggle(innerWidth>800?'sc':'so')}
 else if(a==='open'){cur=b.dataset.id;edit=-1;sv();ui();closeSide();bot(1)}
 else if(a==='del'){e.stopPropagation();const id=b.closest('.ci').dataset.id;if(confirm('Delete this chat?')){chats=chats.filter(x=>x.id!==id);if(cur===id)cur=null;sv();ui()}}
 else if(a==='ren'){e.stopPropagation();const x=chats.find(z=>z.id===b.closest('.ci').dataset.id),t=prompt('Rename chat',x.title);if(t&&t.trim()){x.title=t.trim();sv();ui()}}
 else if(a==='send')send();
 else if(a==='think'){cfg.think=!cfg.think;sv();ui();toast('Thinking '+(cfg.think?'on':'off'))}
 else if(a==='sg')send(b.dataset.t);
 else if(a==='down')bot(1);
 else if(a==='cm')copy(m.content);
 else if(a==='cc')copy(b.closest('.code').querySelector('code').textContent);
 else if(a==='sh'){const t=m.content;navigator.share?navigator.share({text:t}).catch(()=>{}):copy(t)}
 else if(a==='rg'&&!busy){c.msgs.pop();sv();gen()}
 else if(a==='fb'){m.fb=m.fb===+b.dataset.v?0:+b.dataset.v;sv();paintMsgs()}
 else if(a==='ed'&&!busy){edit=i;paintMsgs();const t=$('#ed');t.focus()}
 else if(a==='ecan'){edit=-1;paintMsgs()}
 else if(a==='esave'){const t=$('#ed').value.trim();if(!t)return;c.msgs=c.msgs.slice(0,i);c.msgs.push({role:'user',content:t});edit=-1;sv();gen()}
 else if(a==='set')openSet();
 else if(a==='cs'){rd();$('#md').classList.remove('o')}
 else if(a==='test')test();else if(a==='bal')bal();
 else if(a==='wk')copy(WK);else if(a==='exp')exp();
 else if(a==='clr'&&confirm('Delete ALL chats?')){chats=[];cur=null;sv();ui();$('#md').classList.remove('o')}
});
$('#ov').onclick=closeSide;
$('#md').onclick=e=>{if(e.target.id==='md'){rd();$('#md').classList.remove('o')}};
$('#sm').addEventListener('input',e=>{if(e.target.id==='s-temp')$('#tv').textContent=e.target.value});
$('#q').oninput=e=>{sq=e.target.value.toLowerCase();paintList()};
$('#in').addEventListener('input',fit);
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Android|iPhone|iPad/i.test(navigator.userAgent)){e.preventDefault();send()}});
$('#ms').addEventListener('scroll',()=>{const s=$('#ms');$('#sd').style.display=s.scrollHeight-s.scrollTop-s.clientHeight>250?'flex':'none'});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();newChat()}});
if(!chats.find(c=>c.id===cur))cur=chats.length?chats.sort((a,b)=>b.ts-a.ts)[0].id:null;
theme();ui();if(!cfg.key)setTimeout(openSet,400);
</script>
</body>
</html>
